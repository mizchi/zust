# cargo-mutants settings (used by bench/mutants.sh; also read by a direct `cargo mutants ...`)
# There are about 18,000 mutants, so not all of them are run: bench/mutants.sh narrows them by diff / file / crate / shard

# The build per mutant uses the release settings (many tests compile and run programs with zustc, so debug is slow).
# Incremental builds are on, and no debug info is added
profile = "mutants"

# Not mutated: CLI argument handling, build scripts, test and bench code
exclude_globs = ["src/main.rs", "crates/syntax/build.rs", "benches/**", "tests/**", "crates/*/tests/**", "crates/*/benches/**", "crates/*/src/*_tests.rs"]
# Fns only for display and estimates (they do not affect results)
exclude_re = ["impl (fmt::)?Debug", "impl (fmt::)?Display", "<impl Debug", "<impl Display", "heap_bytes", "::fmt$"]

# Test timeout: cuts off infinite loops made by mutants (3 times the baseline test time or 180 seconds, whichever is larger.
# A test of the whole workspace takes about 1 minute per run, so 60 seconds would cut off even non-mutants)
timeout_multiplier = 3.0
minimum_test_timeout = 180

# So that warnings do not fail the build (variables left unused by a mutation, etc.)
cap_lints = true
