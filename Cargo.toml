[package]
name = "zustc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# examples/ holds inputs to compile with zustc (not Cargo examples; some are no_std)
autoexamples = false

[workspace]
members = ["crates/ir", "crates/minclif", "crates/base", "crates/syntax", "crates/sema", "crates/typeck", "crates/codegen", "crates/core", "crates/clif", "crates/wasm", "crates/ide", "crates/analyzer", "crates/zurgo", "crates/fuzz"]

[features]
# (formerly the feature that enabled the second driver (now the session); it is always in now: kept for the tests' cfg)
default = ["acg"]
acg = []

[dependencies]
zust-core = { path = "crates/core" }
zust-clif = { path = "crates/clif" }
zust-wasm = { path = "crates/wasm" }
minclif = { path = "crates/minclif" }

[dev-dependencies]
# (the benches' lsp/* run the LSP server in-process; zustc itself does not depend on the LSP)
zust-analyzer = { path = "crates/analyzer" }
serde_json = "1"
# (used by the tests to compare with the syn version)
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit", "clone-impls"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "compile"
harness = false

[profile.release]
debug = false

# The per-mutant build of cargo-mutants (.cargo/mutants.toml). The same optimization as release, with incremental builds
[profile.mutants]
inherits = "release"
incremental = true
codegen-units = 64
