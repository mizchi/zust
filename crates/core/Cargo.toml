[package]
name = "zust-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "zustc のドライバ (driver2: 解析・check・キャッシュ。feature build でビルド・並列化・ワークスペース)。下の層を公開し直す。syn と Cranelift に依存しない"

[features]
# Building (machine code, objects, linking). LSP / analysis use default-features = false and do not depend on the backend
default = ["build"]
build = ["dep:zust-codegen"]

[dependencies]
zust-typeck = { path = "../typeck" }
zust-codegen = { path = "../codegen", optional = true }
