[package]
name = "zust-analyzer"
version = "0.1.0"
edition = "2024"
description = "zustc の LSP サーバ (バイナリ zust-analyzer)。診断は driver2 の Session2::check、シンボル・定義・参照・hover・補完は zust-ide。バックエンド (codegen / minclif / Cranelift) に依存しない"

[[bin]]
name = "zust-analyzer"
path = "src/main.rs"

[dependencies]
zust-core = { path = "../core", default-features = false }
zust-ide = { path = "../ide" }
serde_json = "1"
