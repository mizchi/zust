name: Crate survey

# Builds the top crates of crates.io (cratebench/survey/crates.tsv) with zurgo, each in a probe package in a temporary
# directory (sources from crates.io, versions from cratebench/survey/Cargo.lock), and commits what it finds to main:
# CRATES_SUPPORT.md, cratebench/survey/results.json and a row of cratebench/survey/history.tsv. The Pages workflow then
# rebuilds /crates/ from them. It reports; it does not fail on a crate that does not build yet.
#
# Two jobs: the survey runs the crates' build scripts (code from crates.io), so it has a read-only token and keeps no
# credentials in its checkout; the publish job, which may push, runs none of that code and takes the survey's files
# as data.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - crates/**
      - Cargo.lock
      - cratebench/survey/survey.py
      - cratebench/survey/crates.tsv
      - cratebench/survey/Cargo.lock
      - .github/workflows/crate-survey.yml
  workflow_dispatch:

permissions:
  contents: read

# (one run at a time; a push while one runs waits, and only the latest waiting one runs: every run finishes)
concurrency:
  group: crate-survey
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Build zustc and zurgo
        run: cargo build --release -p zustc -p zurgo
      - name: Survey the crates
        run: python3 cratebench/survey/survey.py run --work "$RUNNER_TEMP/crate-survey" --commit "${GITHUB_SHA::7}" --history
      - name: Summary
        if: always()
        run: sed -n '/^## Summary/,/^## By category/p' CRATES_SUPPORT.md | head -n -1 >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: crate-survey
          path: |
            CRATES_SUPPORT.md
            cratebench/survey/results.json
            cratebench/survey/history.tsv
          if-no-files-found: error

  # (as bench.yml commits the README's numbers: on main only, retried when main moves on. No cargo, zurgo or crate
  #  code runs here)
  publish:
    needs: survey
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crate-survey
          path: ${{ runner.temp }}/crate-survey
      - name: Commit the results
        env:
          FROM: ${{ runner.temp }}/crate-survey
        run: |
          files="CRATES_SUPPORT.md cratebench/survey/results.json cratebench/survey/history.tsv"
          for f in $files; do cp "$FROM/$f" "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          if git diff --cached --quiet; then echo "$files unchanged"; exit 0; fi
          git commit -q -m "CRATES_SUPPORT.md: crate survey on ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::could not push $files (main moved on); the next run writes them again"
