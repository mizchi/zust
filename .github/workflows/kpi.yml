name: KPI

# Every push to a pull request: the KPIs of bench/kpi_track.py (instruction counts of zustc on generated programs,
# generic traits and cratebench's crates; one zust-analyzer session; build cache size) for the merge base and for the
# head, measured on the same runner image, and one comment on the PR that shows the change and keeps the result of
# every push (bench/kpi_pr.py). A change past +1% is a ::warning::. A KPI above its ceiling in bench/kpi_ratchet.txt by
# more than the ceiling's tolerance fails the job (bench/kpi_ratchet.py): a cost below the noise of one comparison with
# the base adds up over pull requests, a ceiling does not move with them. Every push to main lowers the ceilings that
# main measures below (the `ratchet` job, a commit of its own); only an edit of the file in a pull request raises one.
#
# The base's numbers are cached by what they depend on (the trees of the code and the benchmarks at the base, the
# toolchain and valgrind's versions), so a push whose merge base was measured before builds and measures the head
# only. Every push to main measures main and keeps it there, for the pull requests whose merge base it is (a cache
# saved on main is read by every pull request; one saved by a pull request only by that one).
#
# The sections are measured in three parts on runners side by side, the base's beside the head's (`plan` lists the parts,
# a `measure` job measures one, `report` puts them together): an instruction count is the same on any runner of the image, so a part's numbers do not depend on where
# it ran. A base whose bench/kpi_track.py has no --only is measured whole on one runner.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# (a new push replaces the run of the one before)
concurrency:
  group: kpi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# (read only, but for the job that comments: the measuring jobs run the pull request's code and tools)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # (the merge base, the cache keys, and the parts to measure: the head's, and the base's when the cache does not have
  # them)
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      base_sha: ${{ steps.keys.outputs.base_sha }}
      base: ${{ steps.keys.outputs.base }}
      head: ${{ steps.keys.outputs.head }}
      base_hit: ${{ steps.base_cache.outputs.cache-hit }}
      parts: ${{ steps.parts.outputs.parts }}
      env: ${{ steps.keys.outputs.env }}
      installer: ${{ steps.keys.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # (valgrind as the measuring jobs install it, from the packages ci.yml keeps or else from the mirror: the key
      # names the version installed, which each measuring job checks it has too)
      - name: Restore valgrind's packages
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-valgrind-ubuntu-24.04-v1
      - name: Install valgrind
        run: bash scripts/ci_install_valgrind.sh
      # (the key of a commit's KPIs: the files they are measured from (not the documents, nor the KPI log that main's
      # commits append to, nor the ceilings the ratchet job lowers; submodules by their commits), and what moves the counts besides them: the toolchain,
      # valgrind, the runner's OS and its C library (cachegrind counts its instructions too). A commit that changes
      # only documents keeps its parent's key)
      - name: Find the merge base and the cache keys
        id: keys
        run: |
          env_now="$(rustc -V) | $(valgrind --version) | ${ImageOS:-} | $(ldd --version 2>&1 | sed -n 1p)"
          echo "env=$env_now" | tee -a "$GITHUB_OUTPUT"
          # (the head's installer, for the measuring jobs, the base's too: a fork's head commit is not in the base's
          # checkout)
          echo "installer=$(base64 -w0 scripts/ci_install_valgrind.sh)" >> "$GITHUB_OUTPUT"
          kpi_key() {
            { echo "$env_now"
              git ls-tree -r "$1" -- crates src cratebench Cargo.toml Cargo.lock build.rs .cargo bench \
                | grep -v -e '\.md$' -e 'bench/kpi_log\.' -e 'bench/kpi_ratchet\.txt'
            } | sha256sum | cut -c1-24
          }
          if [ "${{ github.event_name }}" = pull_request ]; then
            base=$(git merge-base HEAD ${{ github.event.pull_request.base.sha }})
            echo "base_sha=$base" >> "$GITHUB_OUTPUT"
            echo "base=kpi-v3-$(kpi_key "$base")" >> "$GITHUB_OUTPUT"
          fi
          echo "head=kpi-v3-$(kpi_key HEAD)" >> "$GITHUB_OUTPUT"
      - name: Look up the base's KPIs
        if: github.event_name == 'pull_request'
        id: base_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/kpi/base.txt
          key: ${{ steps.keys.outputs.base }}
          lookup-only: true
      # (each part on a runner of its own: gen5000; traits, crates and patterns side by side; the LSP session alone,
      # as its count moves with how often the client polls. With two parts, the second (the three, then the LSP
      # session) took 1:54 on a runner where gen5000 took 0:44. A part's runner builds the workspace (1:40), so the
      # wall time is the build and the longest part)
      - name: List the parts to measure
        id: parts
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ steps.keys.outputs.base_sha }}
          MEASURE_BASE: ${{ github.event_name == 'pull_request' && steps.base_cache.outputs.cache-hit != 'true' }}
        run: |
          parts=""
          add() { parts="$parts${parts:+,}{\"side\":\"$1\",\"sha\":\"$2\",\"part\":\"$3\"}"; }
          for p in gen5000 traits,crates,patterns lsp; do add head "$HEAD_SHA" "$p"; done
          if [ "$MEASURE_BASE" = true ]; then
            # (grep without -q reads all of it: git show is not cut off, which pipefail would take for a failure)
            if git show "$BASE_SHA:bench/kpi_track.py" | grep -- '"--only"' >/dev/null; then
              for p in gen5000 traits,crates,patterns lsp; do add base "$BASE_SHA" "$p"; done
            else
              add base "$BASE_SHA" all
            fi
          fi
          echo "parts=[$parts]" | tee -a "$GITHUB_OUTPUT"

  measure:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # (bash with pipefail: a measurement that fails fails its step, not hidden by its `| tee`, so no empty result is
    # saved as a commit's KPIs)
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.parts) }}
    name: measure ${{ matrix.side }} (${{ matrix.part }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          # (the LSP session reads a snapshot of an older commit: git archive)
          fetch-depth: 0
      - name: Fetch cratebench's crates
        if: contains(matrix.part, 'crates') || matrix.part == 'all'
        run: git submodule update --init --depth 1 cratebench/vendor
      - uses: dtolnay/rust-toolchain@stable
        with:
          # (zust-analyzer reads std from rust-src)
          components: rust-src
      # (as in ci.yml: kache keeps what each compiler run makes, rust-cache the registry and the tools. The release
      # profile is built as it is, with its LTO: the counts are of that binary)
      - uses: kunobi-ninja/kache-action@v1
        with:
          version: v2.3.1
          cache-executables: true
          # (its cache statistics in the job summary only: one comment a measuring job would be one too many)
          pr-comment: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          shared-key: kpi
          save-if: ${{ matrix.side == 'head' && matrix.part == 'gen5000' }}
      - name: Restore valgrind's packages
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-valgrind-ubuntu-24.04-v1
      - name: Install wild, and valgrind in the background
        env:
          INSTALLER: ${{ needs.plan.outputs.installer }}
        run: |
          command -v wild || cargo install --locked wild-linker@0.11.0
          # (as in ci.yml: the build does not need valgrind; nothing of the step's output stays open in the background.
          # The head's script, which plan passes on, for the base too, as plan installed it)
          echo "$INSTALLER" | base64 -d > ~/ci_install_valgrind.sh
          { bash ~/ci_install_valgrind.sh >~/valgrind-install.log 2>&1 </dev/null && echo 0 || echo 1; } >~/valgrind-install.done 2>/dev/null &
      - name: Build
        run: cargo build --release --workspace
      - name: Wait for valgrind
        run: |
          while [ ! -s ~/valgrind-install.done ]; do sleep 1; done
          cat ~/valgrind-install.log
          [ "$(cat ~/valgrind-install.done)" = 0 ] || { echo "valgrind's install failed"; exit 1; }
          valgrind --version
      # (what the key names: a part measured on another toolchain, valgrind, OS or C library than plan's is not kept.
      # Not the image's build (ImageVersion): runners of one run had 20261116.376.1 and 20261116.133.1 during a
      # rollout, with the same toolchain, valgrind and C library, which are what move the counts)
      - name: Check the environment against the plan's
        env:
          PLANNED: ${{ needs.plan.outputs.env }}
        run: |
          env_now="$(rustc -V) | $(valgrind --version) | ${ImageOS:-} | $(ldd --version 2>&1 | sed -n 1p)"
          echo "planned: $PLANNED"; echo "here:    $env_now"
          [ "$env_now" = "$PLANNED" ] || { echo "::error::this runner's environment is not the one plan keyed the KPIs by"; exit 1; }
      - name: Measure
        env:
          PLANNED: ${{ needs.plan.outputs.env }}
          PART: ${{ matrix.part }}
          OUT: ${{ runner.temp }}/kpi/${{ matrix.side }}-${{ strategy.job-index }}.txt
        run: |
          mkdir -p "$(dirname "$OUT")"
          if [ "$PART" = all ]; then
            jobs=""
            if grep -q -- '"--jobs"' bench/kpi_track.py; then jobs="--jobs 4"; fi
            python3 bench/kpi_track.py "$PART" --lsp --dry-run $jobs | tee "$OUT"
          else
            python3 bench/kpi_track.py "$PART" --dry-run --jobs 4 --only "$PART" | tee "$OUT"
          fi
          # (what measured it, which report compares with the plan's: no KPI's name, so kpi_pr.py skips the line)
          echo "measured-with: $PLANNED" | tee -a "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: kpi-${{ matrix.side }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/kpi/${{ matrix.side }}-${{ strategy.job-index }}.txt
          retention-days: 7

  report:
    needs: [plan, measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: kpi-*
          path: ${{ runner.temp }}/parts
          merge-multiple: true
      - name: Put the parts together
        env:
          PLANNED: ${{ needs.plan.outputs.env }}
        run: |
          mkdir -p ~/kpi
          ls -l "$RUNNER_TEMP/parts"
          cat "$RUNNER_TEMP"/parts/head-*.txt > ~/kpi/head.txt
          if ls "$RUNNER_TEMP"/parts/base-*.txt >/dev/null 2>&1; then
            cat "$RUNNER_TEMP"/parts/base-*.txt > ~/kpi/base.txt
          fi
          # (every KPI once, and every part measured where plan keyed it: a base kept in the cache is compared with
          # later heads)
          for f in ~/kpi/head.txt ~/kpi/base.txt; do
            [ -f "$f" ] || continue
            python3 -c "import sys; sys.path.insert(0, 'bench'); import kpi_pr; got = kpi_pr.parse(sys.argv[1]); miss = [k for k in kpi_pr.KPIS if k not in got]; sys.exit(f'{sys.argv[1]}: no {miss}' if miss else 0)" "$f"
          done
          for f in "$RUNNER_TEMP"/parts/*.txt; do
            if [ "$(grep '^measured-with:' "$f" || true)" != "measured-with: $PLANNED" ]; then
              echo "::error::$(basename "$f") was not measured in the planned environment ($PLANNED)"; grep '^measured-with:' "$f" || true
              exit 1
            fi
          done
      - name: Restore the base's KPIs
        if: github.event_name == 'pull_request' && needs.plan.outputs.base_hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/kpi/base.txt
          key: ${{ needs.plan.outputs.base }}
          fail-on-cache-miss: true
      - name: Keep the base's KPIs
        if: github.event_name == 'pull_request' && needs.plan.outputs.base_hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/kpi/base.txt
          key: ${{ needs.plan.outputs.base }}
      - name: Keep main's KPIs for the pull requests based on it
        if: github.event_name == 'push'
        run: cp ~/kpi/head.txt ~/kpi/base.txt
      - name: Save main's KPIs
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ~/kpi/base.txt
          key: ${{ needs.plan.outputs.head }}
      # (the ceilings of the head's bench/kpi_ratchet.txt, the base's beside them to show the ones the pull request
      # raises; the job fails after the comment is written)
      - name: Update the KPI comment on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLANNED: ${{ needs.plan.outputs.env }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          echo "base: ${{ needs.plan.outputs.base_hit == 'true' && 'from the cache' || 'measured in this run' }} (${{ needs.plan.outputs.base }})"
          ratchet_base=()
          if git fetch -q --depth=1 origin "$BASE_SHA" && git show "$BASE_SHA:bench/kpi_ratchet.txt" > "$RUNNER_TEMP/ratchet-base.txt" 2>/dev/null; then
            ratchet_base=(--ratchet-base "$RUNNER_TEMP/ratchet-base.txt")
          fi
          status=0
          python3 bench/kpi_pr.py --base ~/kpi/base.txt --head ~/kpi/head.txt \
            --base-sha "$BASE_SHA" --head-sha ${{ github.event.pull_request.head.sha }} \
            --pr ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --ratchet bench/kpi_ratchet.txt "${ratchet_base[@]}" --env "$PLANNED" \
            --out "$RUNNER_TEMP/kpi.md" || status=$?
          cat "$RUNNER_TEMP/kpi.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # (every push to main: main's KPIs against the ceilings of bench/kpi_ratchet.txt, one above its own a ::warning::
  # (a pull request is checked at its head, against its merge base: two that each passed may together pass one); and
  # the ceilings that main measures below by more than their tolerance become what it measured, and in another environment all of them do, in a commit on main that skips CI. The
  # only job that writes to the repository; it runs main's code. A ceiling changed on main since this commit is left as
  # it is: the next push's run lowers from there)
  ratchet:
    needs: [plan, report]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kpi-head-*
          path: ${{ runner.temp }}/parts
          merge-multiple: true
      - name: Lower the ceilings to main's KPIs
        env:
          PLANNED: ${{ needs.plan.outputs.env }}
        run: |
          cat "$RUNNER_TEMP"/parts/head-*.txt > "$RUNNER_TEMP/head.txt"
          python3 bench/kpi_ratchet.py check bench/kpi_ratchet.txt --head "$RUNNER_TEMP/head.txt" --env "$PLANNED" --warn
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- bench/kpi_ratchet.txt; then
              echo "bench/kpi_ratchet.txt changed on main after ${GITHUB_SHA::7}: left to the next push"; exit 0
            fi
            git reset -q --hard FETCH_HEAD
            python3 bench/kpi_ratchet.py tighten bench/kpi_ratchet.txt --head "$RUNNER_TEMP/head.txt" --env "$PLANNED" --sha "${GITHUB_SHA::8}" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            if git diff --quiet -- bench/kpi_ratchet.txt; then exit 0; fi
            git commit -q -m "KPI ratchet: ceilings measured on ${GITHUB_SHA::7} [skip ci]" bench/kpi_ratchet.txt
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::warning::could not push bench/kpi_ratchet.txt (main moved on); the next push to main lowers the ceilings"
