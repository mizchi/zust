name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # (サイズ予算 bench/budget.txt は wild で測った大きさ。リンカで変わるので固定する)
  ZUSTC_BENCH_LINKER: wild

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # (the workspace's crates are built again on every run: without the crate-local ThinLTO they build in ~2/3 of
      # the time, and zustc runs ~15% slower, which the tests spend less on. bench.yml measures the release profile
      # as it is)
      CARGO_PROFILE_RELEASE_LTO: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            formal/connect -> target
      # (valgrind's packages, kept between runs: a slow mirror once took 5 minutes to download them)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Restore valgrind's packages
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-valgrind-ubuntu-24.04-v1
      - name: Install wild, and valgrind in the background
        run: |
          command -v wild || cargo install --locked wild-linker@0.11.0
          # (the "Wait for valgrind" step waits for it: the build does not need valgrind. Nothing of the step's stdout or
          # stderr stays open in the background, or the runner waits for it before the next step)
          { scripts/ci_install_valgrind.sh >~/valgrind-install.log 2>&1 </dev/null && echo 0 || echo 1; } >~/valgrind-install.done 2>/dev/null &
      - name: Build
        run: cargo build --release --workspace
      - name: Wait for valgrind
        run: |
          while [ ! -s ~/valgrind-install.done ]; do sleep 1; done
          cat ~/valgrind-install.log
          [ "$(cat ~/valgrind-install.done)" = 0 ] || { echo "valgrind's install failed"; exit 1; }
          valgrind --version
      # (nextest runs the test binaries side by side too, where cargo test runs them one after another: 71s -> 50s
      # on 4 cores. `cargo test` runs the same tests. .config/nextest.toml has the ci profile)
      - name: Test
        run: |
          cargo nextest run --release --workspace --profile ci
          cargo test --release --workspace --doc
      - name: Compare with rustc (examples)
        run: tests/compare.sh
      # (zustc's prelude, compiled by zustc, against TLA+ models: formal/connect)
      - name: Implementation against the models
        run: cargo test --release --manifest-path formal/connect/Cargo.toml

  rust-ui:
    # (rustc's own tests/ui: fail if a test zustc passed (bench/rust_ui_passing.txt) no longer passes)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install wild
        run: command -v wild || cargo install --locked wild-linker@0.11.0
      - name: Build zustc
        run: cargo build --release --bin zustc
      - name: Fetch rust-lang/rust tests/ui
        run: python3 bench/rust_ui.py --fetch
      - name: Run tests/ui against the baseline
        run: python3 bench/rust_ui.py --baseline bench/rust_ui_passing.txt --check

  docs:
    # (英語の文書と日本語訳: 組がそろっているか・記録した jev-lint の判定が今の文書のものか。API キーは要らない)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check English / Japanese documents
        run: scripts/docs_check.sh
