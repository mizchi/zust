name: Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

# (gh-pages に結果を積むので、同時に 1 つだけ)
concurrency:
  group: bench
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src, rust-analyzer
      - uses: Swatinem/rust-cache@v2
      - name: Install wild and valgrind
        run: |
          command -v wild || cargo install --locked wild-linker@0.11.0
          sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build
        run: cargo build --release --workspace
      - name: Run benchmarks
        run: python3 bench/ci_bench.py --out-dir out/ci
      - name: Run rustc's tests/ui
        run: |
          python3 bench/rust_ui.py --fetch
          python3 bench/rust_ui.py --bench-json out/ci/rust_ui.json --json out/ci/rust_ui_summary.json --results out/ci/rust_ui.tsv --reasons out/ci/rust_ui_reasons.tsv
      # (the measured numbers in README.md, PERFORMANCE.md and SUPPORT.md come from this run; the commit skips CI, so
      # it does not measure itself)
      - name: Update the numbers in README.md, PERFORMANCE.md and SUPPORT.md
        run: python3 scripts/update_readme.py --ci-dir out/ci --commit "$GITHUB_SHA"
      - name: Commit the measured numbers
        run: |
          files="README.md PERFORMANCE.md SUPPORT.md"
          if git diff --quiet $files; then echo "$files unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "README: numbers measured on ${GITHUB_SHA::7} [skip ci]" $files
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::could not push $files (main moved on); the next run writes them again"
      - name: Store zustc results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: zustc
          tool: customSmallerIsBetter
          output-file-path: out/ci/zustc.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: "130%"
          comment-on-alert: false
          fail-on-alert: false
      - name: Store zust-analyzer results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: zust-analyzer
          tool: customSmallerIsBetter
          output-file-path: out/ci/analyzer.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: "130%"
          comment-on-alert: false
          fail-on-alert: false
      - name: Store parity with rust-analyzer
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: zust-analyzer parity with rust-analyzer
          tool: customBiggerIsBetter
          output-file-path: out/ci/parity.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: "105%"
          comment-on-alert: false
          fail-on-alert: false
      - name: Store rustc tests/ui pass rates
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: rustc tests/ui
          tool: customBiggerIsBetter
          output-file-path: out/ci/rust_ui.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: "102%"
          comment-on-alert: false
          fail-on-alert: false
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            out/ci/*.json
            out/ci/work/lsp_parity_result.md
            out/rust_ui_results.txt
